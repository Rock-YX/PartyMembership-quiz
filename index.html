<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>入党申请人结业考试刷题</title>
<meta name="description" content="天津大学入党申请人培训结业考试选择题与填空题刷题程序，按题型与事件线分类标签，支持模拟试卷、即时刷题、分类练习与错题重练。">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
/* ============================================================
   入党申请人结业考试刷题 · 样式
   视觉方向：党校讲义与答题卡的世界 —— 冷调纸面、宋体标题、
   批改朱红、铅笔填涂的方格。签名元素：右侧答题卡与填涂方格。
   ============================================================ */

:root {
  --paper: #eff1ea;
  --paper-2: #f7f8f2;
  --card: #fbfcf7;
  --ink: #1b221c;
  --ink-2: #4c564a;
  --ink-3: #7c857a;
  --rule: #d2d6cb;
  --rule-strong: #b7bdaf;
  --red: #b03a2e;
  --red-deep: #8a2b22;
  --green: #2e6b50;
  --amber: #9a6b22;
  --blue: #2f5568;
  --gold: #8a6a1f;
  --shadow: 0 1px 0 rgba(27, 34, 28, 0.05), 0 14px 34px -26px rgba(27, 34, 28, 0.55);
  --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}

[data-theme="dark"] {
  --paper: #131711;
  --paper-2: #191e18;
  --card: #1d231c;
  --ink: #e8ebe1;
  --ink-2: #b0b9a9;
  --ink-3: #828b7e;
  --rule: #333a31;
  --rule-strong: #4a5347;
  --red: #e0705f;
  --red-deep: #c25a4b;
  --green: #7fbe9e;
  --amber: #d3a456;
  --blue: #93b8cb;
  --gold: #d2b266;
  --shadow: 0 1px 0 rgba(0, 0, 0, 0.4), 0 18px 36px -28px rgba(0, 0, 0, 0.9);
}

* { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    repeating-linear-gradient(90deg, rgba(120, 130, 110, 0.05) 0 1px, transparent 1px 96px),
    repeating-linear-gradient(0deg, rgba(120, 130, 110, 0.035) 0 1px, transparent 1px 96px);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--ink); }
button { font-family: inherit; }

.app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 28px 72px;
}

/* ---------- 顶栏 ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 14px 24px;
  padding: 18px 0 14px;
  border-bottom: 1px solid var(--rule-strong);
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px);
}

.brand { display: flex; flex-direction: column; gap: 2px; }
.brand-kicker {
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
}
.brand-title {
  font-family: var(--serif);
  font-size: 21px;
  font-weight: 700;
  letter-spacing: 0.04em;
  margin: 0;
  line-height: 1.3;
}

.nav {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.nav-btn {
  appearance: none;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-2);
  font-size: 13px;
  padding: 7px 11px;
  border-radius: 3px;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  white-space: nowrap;
}
.nav-btn:hover { border-color: var(--rule-strong); color: var(--ink); }
.nav-btn[aria-current="true"] {
  border-color: var(--ink);
  color: var(--ink);
  background: var(--paper-2);
  font-weight: 500;
}
.nav-btn.primary {
  background: var(--ink);
  border-color: var(--ink);
  color: var(--paper-2);
  font-weight: 500;
}
.nav-btn.primary:hover { background: var(--red-deep); border-color: var(--red-deep); color: #fdfcf7; }

/* ---------- 首页 ---------- */
.cover {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 40px;
  padding: 52px 0 42px;
  align-items: start;
}

.cover-main { display: flex; flex-direction: column; gap: 22px; }

.cover-eyebrow {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  letter-spacing: 0.16em;
  color: var(--ink-3);
}
.cover-eyebrow::before {
  content: "";
  width: 26px;
  height: 1px;
  background: var(--red);
}

.cover-title {
  font-family: var(--serif);
  font-size: clamp(34px, 5vw, 56px);
  font-weight: 900;
  line-height: 1.16;
  letter-spacing: 0.02em;
  margin: 0;
}
.cover-title em {
  font-style: normal;
  color: var(--red-deep);
}

.cover-sub {
  max-width: 40ch;
  color: var(--ink-2);
  font-size: 14px;
  margin: 0;
}

.cover-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 0;
  border-top: 1px solid var(--rule-strong);
  border-bottom: 1px solid var(--rule-strong);
  margin-top: 6px;
}
.stat {
  flex: 1 1 0;
  min-width: 96px;
  padding: 14px 16px 12px;
  border-right: 1px solid var(--rule);
}
.stat:last-child { border-right: 0; }
.stat-num {
  font-family: var(--serif);
  font-size: 30px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  display: block;
}
.stat-label {
  font-size: 11px;
  letter-spacing: 0.12em;
  color: var(--ink-3);
  display: block;
  margin-top: 4px;
}

/* 印章：页脚式落款 */
.seal-wrap { display: flex; justify-content: flex-end; padding-top: 8px; }
.seal {
  border: 2px solid var(--red-deep);
  color: var(--red-deep);
  padding: 12px 14px;
  font-family: var(--serif);
  font-size: 13px;
  line-height: 1.35;
  letter-spacing: 0.18em;
  text-align: center;
  transform: rotate(-2.5deg);
  border-radius: 3px;
  max-width: 132px;
  opacity: 0.9;
}

/* 首页右侧：答题卡缩略 */
.cover-side { display: flex; flex-direction: column; gap: 14px; }
.side-note {
  font-size: 12px;
  color: var(--ink-3);
  letter-spacing: 0.08em;
  margin: 0;
}
.mini-card {
  background: var(--card);
  border: 1px solid var(--rule-strong);
  padding: 18px;
  box-shadow: var(--shadow);
}
.mini-card-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  border-bottom: 1px solid var(--rule);
  padding-bottom: 10px;
  margin-bottom: 14px;
}
.mini-card-head h3 {
  font-family: var(--serif);
  font-size: 15px;
  letter-spacing: 0.1em;
  margin: 0;
  font-weight: 700;
}
.mini-card-head span {
  font-size: 11px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.mini-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 5px;
}
.mini-cell {
  aspect-ratio: 1 / 1;
  border: 1px solid var(--rule);
  display: grid;
  place-items: center;
  font-size: 9px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.mini-cell.hit { background: var(--ink); border-color: var(--ink); color: var(--paper-2); }
.mini-cell.smudge { background: color-mix(in srgb, var(--ink) 18%, transparent); border-color: var(--rule-strong); }

/* ---------- 模式选择 ---------- */
.section-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  border-top: 1px solid var(--rule-strong);
  padding-top: 16px;
  margin: 36px 0 18px;
}
.section-title {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.08em;
  margin: 0;
}
.section-note { font-size: 12px; color: var(--ink-3); margin: 0; }

.mode-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 14px;
}

.mode-card {
  text-align: left;
  background: var(--card);
  border: 1px solid var(--rule);
  padding: 20px 20px 18px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 8px;
  position: relative;
  transition: border-color 0.16s ease, transform 0.16s ease, box-shadow 0.16s ease;
  box-shadow: var(--shadow);
  border-radius: 2px;
}
.mode-card:hover {
  border-color: var(--ink);
  transform: translateY(-2px);
}
.mode-card:focus-visible {
  outline: 2px solid var(--red);
  outline-offset: 2px;
}
.mode-card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.mode-name { font-family: var(--serif); font-size: 18px; font-weight: 700; letter-spacing: 0.06em; }
.mode-mark { width: 22px; height: 22px; border: 1px solid var(--rule-strong); display: grid; place-items: center; }
.mode-mark svg { width: 12px; height: 12px; }
.mode-desc { display: block; font-size: 13px; color: var(--ink-2); margin: 0; min-height: 44px; }
.mode-meta {
  font-size: 11px;
  color: var(--ink-3);
  letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
  border-top: 1px dashed var(--rule);
  padding-top: 8px;
  display: flex;
  justify-content: space-between;
}
.mode-card.off { opacity: 0.55; cursor: not-allowed; }
.mode-card.off:hover { transform: none; border-color: var(--rule); }

/* ---------- 标签分组 ---------- */
.tag-groups { display: flex; flex-direction: column; }

.tag-group-block {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px 0 18px;
  border-bottom: 1px dashed var(--rule);
}
.tag-group-block:last-child { border-bottom: 0; }

.tag-group-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tag-group-name {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.08em;
}
.tag-group-note { font-size: 11.5px; color: var(--ink-3); }

.start-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  border: 1px solid var(--rule-strong);
  background: var(--card);
  padding: 16px 20px;
  margin-top: 8px;
  position: sticky;
  bottom: 16px;
  box-shadow: var(--shadow);
  border-radius: 2px;
}
.start-info { font-size: 13px; color: var(--ink-2); }
.start-info strong {
  font-family: var(--serif);
  font-size: 20px;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
  margin: 0 2px;
}

.bar-name[data-tone="red"] { color: var(--red-deep); }
.bar-name[data-tone="green"] { color: var(--green); }
.bar-name[data-tone="amber"] { color: var(--amber); }
.bar-name[data-tone="blue"] { color: var(--blue); }
.bar-name[data-tone="crimson"] { color: var(--red); }
.bar-name[data-tone="gold"] { color: var(--gold); }

/* ---------- 通用按钮 ---------- */
.btn {
  appearance: none;
  border: 1px solid var(--rule-strong);
  background: var(--paper-2);
  color: var(--ink);
  font-size: 13px;
  padding: 9px 14px;
  border-radius: 3px;
  cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  min-height: 38px;
}
.btn:hover { border-color: var(--ink); }
.btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.btn-solid { background: var(--ink); border-color: var(--ink); color: var(--paper-2); font-weight: 500; }
.btn-solid:hover { background: var(--red-deep); border-color: var(--red-deep); color: #fdfcf7; }
.btn-ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn-ghost:hover { border-color: var(--rule-strong); color: var(--ink); }
.btn-sm { font-size: 12px; padding: 6px 10px; min-height: 30px; }
.btn[disabled] { opacity: 0.4; cursor: not-allowed; }

.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- 标签 ---------- */
.tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  line-height: 1;
  padding: 5px 8px;
  border: 1px solid var(--rule-strong);
  border-radius: 2px;
  color: var(--ink-2);
  background: transparent;
  letter-spacing: 0.04em;
  white-space: nowrap;
}
.tag[data-tone="red"] { color: var(--red-deep); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
.tag[data-tone="green"] { color: var(--green); border-color: color-mix(in srgb, var(--green) 45%, transparent); }
.tag[data-tone="amber"] { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
.tag[data-tone="blue"] { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 45%, transparent); }
.tag[data-tone="crimson"] { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); }
.tag[data-tone="gold"] { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 45%, transparent); }

.tag.is-active { background: var(--ink); border-color: var(--ink); color: var(--paper-2); }

.tag-button { cursor: pointer; }
.tag-button:hover { border-color: var(--ink); }

/* 题型徽标 */
.type-badge {
  font-size: 11px;
  letter-spacing: 0.12em;
  padding: 4px 8px;
  border: 1px solid var(--ink);
  color: var(--ink);
  border-radius: 2px;
  white-space: nowrap;
}
.type-badge.fill { border-color: var(--blue); color: var(--blue); }
.type-badge.multi { border-color: var(--amber); color: var(--amber); }

/* ---------- 答题视图 ---------- */
.quiz-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 268px;
  gap: 28px;
  padding-top: 26px;
  align-items: start;
}

.sheet {
  background: var(--card);
  border: 1px solid var(--rule-strong);
  box-shadow: var(--shadow);
  padding: 26px 30px 22px;
  position: relative;
  border-radius: 2px;
}
.sheet::before {
  content: "";
  position: absolute;
  left: 14px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: color-mix(in srgb, var(--red) 22%, transparent);
}

.sheet-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 20px;
  font-size: 12px;
  color: var(--ink-3);
}
.sheet-index {
  font-family: var(--serif);
  font-size: 13px;
  color: var(--ink);
  letter-spacing: 0.1em;
  font-variant-numeric: tabular-nums;
}
.sheet-head .spacer { flex: 1 1 auto; }

.stem {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.85;
  font-weight: 600;
  letter-spacing: 0.01em;
  margin: 0 0 22px;
}
.blankslot {
  display: inline-block;
  min-width: 46px;
  border-bottom: 1px solid var(--ink);
  text-align: center;
  font-family: var(--sans);
  font-weight: 400;
}

.options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; }

.option {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  text-align: left;
  background: transparent;
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 12px 14px;
  cursor: pointer;
  transition: border-color 0.14s ease, background 0.14s ease;
  width: 100%;
}
.option:hover { border-color: var(--ink); background: var(--paper-2); }
.option:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.option-marker {
  flex: 0 0 auto;
  width: 22px;
  height: 22px;
  border: 1px solid var(--rule-strong);
  display: grid;
  place-items: center;
  font-size: 11px;
  font-family: var(--serif);
  color: var(--ink-2);
  margin-top: 2px;
  transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease;
}
.option-text { font-size: 14.5px; line-height: 1.65; color: var(--ink); }

.option.selected { border-color: var(--ink); background: var(--paper-2); }
.option.selected .option-marker { background: var(--ink); border-color: var(--ink); color: var(--paper-2); }

.option.correct { border-color: var(--green); background: color-mix(in srgb, var(--green) 9%, transparent); }
.option.correct .option-marker { border-color: var(--green); color: var(--green); }
.option.correct.selected .option-marker { background: var(--green); border-color: var(--green); color: var(--paper-2); }
.option.wrong { border-color: var(--red); background: color-mix(in srgb, var(--red) 9%, transparent); }
.option.wrong .option-marker { border-color: var(--red); color: var(--red); }
.option.wrong.selected .option-marker { background: var(--red); border-color: var(--red); color: #fdfcf7; }
.option.locked { cursor: default; }
.option.locked:hover { background: transparent; border-color: var(--rule); }
.option.locked.correct:hover { border-color: var(--green); }
.option.locked.wrong:hover { border-color: var(--red); }

/* 多选「漏选」：选对的绿、漏掉的琥珀、选错的红 */
.option.missed {
  border-color: var(--amber);
  border-style: dashed;
  background: color-mix(in srgb, var(--amber) 7%, transparent);
}
.option.missed .option-marker { border-color: var(--amber); color: var(--amber); }
.option.locked.missed:hover { border-color: var(--amber); }
.option-tag {
  margin-left: auto;
  flex: 0 0 auto;
  align-self: center;
  font-size: 10.5px;
  letter-spacing: 0.12em;
  padding: 1px 5px;
  border: 1px solid currentColor;
  border-radius: 2px;
  white-space: nowrap;
}
.option-tag.part { color: var(--amber); }

/* 填空输入 */
.fill-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 10px; }
.fill-row { display: flex; align-items: center; gap: 12px; }
.fill-no {
  flex: 0 0 26px;
  font-family: var(--serif);
  font-size: 12px;
  color: var(--ink-3);
  font-variant-numeric: tabular-nums;
}
.fill-input {
  flex: 1 1 auto;
  min-width: 0;
  background: var(--paper-2);
  border: 1px solid var(--rule);
  border-radius: 3px;
  padding: 10px 12px;
  font-family: var(--sans);
  font-size: 14px;
  color: var(--ink);
  min-height: 44px;
}
.fill-input:focus { outline: 2px solid var(--red); outline-offset: 1px; border-color: var(--ink); }
.fill-input.ok { border-color: var(--green); background: color-mix(in srgb, var(--green) 12%, var(--card)); }
.fill-input.no { border-color: var(--red); background: color-mix(in srgb, var(--red) 12%, var(--card)); }
/* 半对：整题部分正确时，错的空用琥珀，不是红 */
.fill-input.half { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 9%, var(--card)); }
.fill-input.gap { border-color: var(--amber); border-style: dashed; background: transparent; }
.fill-flag.half { color: var(--amber); }
.fill-input[readonly] { color: var(--ink-2); }
.fill-flag {
  flex: 0 0 34px;
  text-align: center;
  font-size: 12px;
  color: var(--ink-3);
}

/* 判定结果区 */
.feedback {
  border-top: 1px solid var(--rule);
  margin-top: 18px;
  padding-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.feedback-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.verdict {
  font-family: var(--serif);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 0.06em;
}
.verdict.ok { color: var(--green); }
.verdict.no { color: var(--red); }
.verdict.part { color: var(--amber); }
.answer-line { font-size: 13.5px; color: var(--ink); }
.answer-line strong { font-family: var(--serif); letter-spacing: 0.06em; }
.explain { font-size: 13px; color: var(--ink-2); line-height: 1.75; margin: 0; }
.explain::before {
  content: "解析";
  font-family: var(--serif);
  color: var(--red-deep);
  margin-right: 8px;
  letter-spacing: 0.08em;
}

.sheet-foot {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  border-top: 1px solid var(--rule);
  margin-top: 22px;
  padding-top: 16px;
}
.sheet-foot .spacer { flex: 1 1 auto; }

/* ---------- 答题卡 ---------- */
.card-sheet {
  position: sticky;
  top: 92px;
  background: var(--card);

<script>
/* ============================================================
   刷题核心：题库索引、判分、组卷、本地存储
   ============================================================ */

(function () {
  var CHOICE = window.BANK_CHOICE || [];
  var FILL = window.BANK_FILL || [];
  var ALL = CHOICE.concat(FILL);

  var TAGS = window.QUIZ_TAGS || [];
  var GROUPS = window.QUIZ_GROUPS || [];

  var TAG_MAP = {};
  TAGS.forEach(function (t) { TAG_MAP[t.id] = t; });
  var GROUP_MAP = {};
  GROUPS.forEach(function (g) { GROUP_MAP[g.id] = g; });

  var INDEX = {};
  ALL.forEach(function (q) { INDEX[q.id] = q; });

  var LS_KEY = "tddx-quiz-v1";

  /* ---------------- 存储 ---------------- */

  var DEFAULTS = {
    theme: "light",
    marked: [],
    excluded: [],
    wrong: [],
    records: [],
    paper: null,
    papers: {}
  };

  function load() {
    var raw = null;
    try { raw = window.localStorage.getItem(LS_KEY); } catch (e) { raw = null; }
    var data = {};
    if (raw) {
      try { data = JSON.parse(raw) || {}; } catch (e) { data = {}; }
    }
    var state = {};
    Object.keys(DEFAULTS).forEach(function (k) {
      state[k] = data[k] === undefined ? DEFAULTS[k] : data[k];
    });
    if (!Array.isArray(state.marked)) state.marked = [];
    if (!Array.isArray(state.excluded)) state.excluded = [];
    if (!Array.isArray(state.wrong)) state.wrong = [];
    if (!Array.isArray(state.records)) state.records = [];
    /* 每种练习模式各留一份卷子，切栏目不互相覆盖 */
    if (!state.papers || typeof state.papers !== "object") state.papers = {};
    if (state.paper && state.paper.mode) {
      if (!state.papers[state.paper.mode]) state.papers[state.paper.mode] = state.paper;
      state.paper = state.papers[state.paper.mode];
    }
    return state;
  }

  var store = load();

  function save() {
    try {
      window.localStorage.setItem(LS_KEY, JSON.stringify(store));
    } catch (e) {
      /* 隐私模式下不可写时静默降级，功能仍可用 */
    }
  }

  /* ---------------- 工具 ---------------- */

  function shuffle(list) {
    var arr = list.slice();
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function uniq(list) {
    var seen = {};
    var out = [];
    list.forEach(function (x) {
      if (!seen[x]) { seen[x] = 1; out.push(x); }
    });
    return out;
  }

  function tagOf(id) { return TAG_MAP[id] || { id: id, name: id, group: "" }; }

  function tagSelectors(q) {
    return (q.tags || []).map(tagOf);
  }

  /* 填空答案归一化：去空格与标点、统一全半角、统一破折号 */
  function normalize(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replace(/\u3000/g, " ")
      .replace(/[\s]+/g, "")
      .replace(/[\u201c\u201d\u2018\u2019"'《》〈〉【】（）()［］\[\]、，。；：！？,.;:!?·…~～]/g, "")
      .replace(/[—–－−]/g, "-")
      .replace(/％/g, "%")
      .replace(/．/g, ".")
      .replace(/Ａ|Ｂ|Ｃ|Ｄ/g, function (m) { return m.toLowerCase(); })
      .toLowerCase();
  }

  function checkBlank(value, blank) {
    var got = normalize(value);
    if (!got) return false;
    var accepted = blank.a || [];
    for (var i = 0; i < accepted.length; i++) {
      if (normalize(accepted[i]) === got) return true;
    }
    if (blank.k && blank.k.length) {
      return blank.k.every(function (kw) { return got.indexOf(normalize(kw)) !== -1; });
    }
    return false;
  }

  function maxScore(q) {
    if (q.type === "single") return 1;
    if (q.type === "multi") return 2;
    return (q.blanks || []).length * 0.5;
  }

  function isAnswered(q, ans) {
    if (q.type === "single" || q.type === "multi") {
      return Array.isArray(ans) ? ans.length > 0 : !!ans;
    }
    if (!Array.isArray(ans)) return false;
    return ans.some(function (v) { return String(v || "").trim() !== ""; });
  }

  /* 判分：返回 {status, score, max} */
  function gradeQuestion(q, ans, amend) {
    var max = maxScore(q);
    var answered = isAnswered(q, ans);
    if (!answered) {
      /* 未作答一律计为答错：包括直接点「显示答案」跳过的题 */
      return { status: "wrong", score: 0, max: max, blank: true };
    }
    var score = 0;
    var status = "wrong";

    if (q.type === "single") {
      if (ans === q.answer) { score = 1; status = "correct"; }
    } else if (q.type === "multi") {
      var picked = Array.isArray(ans) ? uniq(ans) : [];
      var right = q.answer.split("");
      var hitAll = picked.every(function (x) { return right.indexOf(x) !== -1; });
      if (hitAll && picked.length === right.length) { score = 2; status = "correct"; }
      else if (hitAll) { score = 1; status = "partial"; }
      else { score = 0; status = "wrong"; }
    } else {
      var blanks = q.blanks || [];
      var vals = Array.isArray(ans) ? ans : [];
      var rightCount = 0;
      blanks.forEach(function (b, i) {
        if (checkBlank(vals[i], b)) rightCount++;
      });
      score = rightCount * 0.5;
      if (rightCount === blanks.length) { status = "correct"; }
      else if (rightCount > 0) { status = "partial"; }
      else { status = "wrong"; }
    }

    if (amend && status !== "correct") {
      return { status: "correct", score: max, max: max, amended: true };
    }
    return { status: status, score: score, max: max };
  }

  /* ---------------- 组卷 ---------------- */

  function availablePool() {
    return ALL.filter(function (q) { return store.excluded.indexOf(q.id) === -1; });
  }

  function pick(list, n) {
    return shuffle(list).slice(0, n).map(function (q) { return q.id; });
  }

  function newPaper(mode, opts) {
    opts = opts || {};
    var pool = availablePool();
    var qids = [];
    var label = "";

    if (mode === "exam") {
      var singles = pool.filter(function (q) { return q.type === "single"; });
      var multis = pool.filter(function (q) { return q.type === "multi"; });
      var fills = pool.filter(function (q) { return q.type === "fill"; });
      qids = pick(singles, 20).concat(pick(multis, 5)).concat(pick(fills, 3));
      /* 按「单选—多选—填空」的卷面顺序排列 */
      label = "模拟试卷";
    } else if (mode === "practice") {
      qids = pick(pool, Math.min(opts.count || 30, pool.length));
      label = "即时刷题";
    } else if (mode === "tag") {
      var tags = opts.tags || [];
      var type = opts.type || "all";
      var filtered = pool.filter(function (q) {
        if (type !== "all" && q.type !== type) return false;
        if (!tags.length) return true;
        return (q.tags || []).some(function (t) { return tags.indexOf(t) !== -1; });
      });
      /* 分类练习：该分类下的题全刷一遍，只打乱顺序，不做截断 */
      qids = pick(filtered, filtered.length);
      var names = tags.map(function (id) { return tagOf(id).name; });
      label = names.length ? ("分类练习 · " + names.join(" / ")) : ("分类练习 · " + tagNameOfType(type));
    } else if (mode === "wrong") {
      var ids = store.wrong.map(function (w) { return w.id; }).filter(function (id) {
        return INDEX[id] && store.excluded.indexOf(id) === -1;
      });
      qids = shuffle(uniq(ids));
      label = "错题重练";
    }

    if (!qids.length) return null;

    var answers = {};
    var checked = {};
    qids.forEach(function (id) {
      var q = INDEX[id];
      answers[id] = q.type === "fill"
        ? (q.blanks || []).map(function () { return ""; })
        : (q.type === "multi" ? [] : "");
    });

    var paper = {
      mode: mode,
      label: label,
      qids: qids,
      answers: answers,
      checked: checked,
      amend: {},
      index: 0,
      created: Date.now(),
      submitted: false,
      review: false,
      filter: { tags: opts.tags || [], type: opts.type || "all" }
    };
    store.papers[mode] = paper;
    store.paper = paper;
    save();
    return paper;
  }

  function tagNameOfType(type) {
    if (type === "single") return "单选题";
    if (type === "multi") return "多选题";
    if (type === "fill") return "填空题";
    return "全部题型";
  }

  function clearPaper() {
    if (store.paper && store.paper.mode) delete store.papers[store.paper.mode];
    store.paper = null;
    save();
  }

  /* 某个模式下还没交卷的那份卷子，没有则 null */
  function stashed(mode) {
    var p = (store.papers || {})[mode];
    return p && !p.submitted ? p : null;
  }

  /* 把某个模式的卷子切成当前卷子，作答进度原样保留 */
  function openPaper(mode) {
    var p = (store.papers || {})[mode];
    if (!p) return null;
    store.paper = p;
    save();
    return p;
  }

  /* ---------------- 记录 ---------------- */

  function markWrong(id) {
    var found = null;
    store.wrong.forEach(function (w) { if (w.id === id) found = w; });
    if (found) {
      found.n = (found.n || 1) + 1;
      found.ts = Date.now();
    } else {
      store.wrong.push({ id: id, n: 1, ts: Date.now() });
    }
  }

  function removeWrong(id) {
    store.wrong = store.wrong.filter(function (w) { return w.id !== id; });
  }

  function toggleMark(id) {
    var i = store.marked.indexOf(id);
    if (i === -1) store.marked.push(id); else store.marked.splice(i, 1);
    save();
    return i === -1;
  }

  function toggleExclude(id) {
    var i = store.excluded.indexOf(id);
    if (i === -1) store.excluded.push(id); else store.excluded.splice(i, 1);
    save();
    return i === -1;
  }

  function summarize(paper) {
    var total = 0, max = 0, correct = 0, wrong = 0, partial = 0, blank = 0;
    var tagAgg = {};
    paper.qids.forEach(function (id) {
      var q = INDEX[id];
      var r = gradeQuestion(q, paper.answers[id], paper.amend[id]);
      total += r.score;
      max += r.max;
      if (r.status === "correct") correct++;
      else if (r.status === "partial") partial++;
      else if (r.status === "wrong") wrong++;
      else blank++;
      (q.tags || []).forEach(function (t) {
        if (!tagAgg[t]) tagAgg[t] = { right: 0, all: 0 };
        tagAgg[t].all++;
        if (r.status === "correct" || r.status === "partial") tagAgg[t].right++;
      });
    });
    return {
      score: Math.round(total * 10) / 10,
      max: Math.round(max * 10) / 10,
      correct: correct,
      partial: partial,
      wrong: wrong,
      blank: blank,
      count: paper.qids.length,
      tagAgg: tagAgg
    };
  }

  function recordResult(paper) {
    var s = summarize(paper);
    store.records.unshift({
      ts: Date.now(),
      label: paper.label,
      mode: paper.mode,
      score: s.score,
      max: s.max,
      count: s.count,
      correct: s.correct
    });
    store.records = store.records.slice(0, 40);
    save();
  }

  /* ---------------- 统计 ---------------- */

  function counts() {
    var c = { single: 0, multi: 0, fill: 0, total: ALL.length, tags: {} };
    ALL.forEach(function (q) {
      c[q.type]++;
      (q.tags || []).forEach(function (t) { c.tags[t] = (c.tags[t] || 0) + 1; });
    });
    return c;
  }

  function tagCount(id) {
    if (!id) return 0;
    return ALL.filter(function (q) { return (q.tags || []).indexOf(id) !== -1; }).length;
  }

  window.QUIZ = {
    all: ALL,
    byId: function (id) { return INDEX[id]; },
    tagOf: tagOf,
    tagSelectors: tagSelectors,
    groupOf: function (id) { return GROUP_MAP[id] || { id: id, name: id, tone: "" }; },
    tags: TAGS,
    groups: GROUPS,
    store: store,
    save: save,
    shuffle: shuffle,
    normalize: normalize,
    checkBlank: checkBlank,
    maxScore: maxScore,
    isAnswered: isAnswered,
    grade: gradeQuestion,
    newPaper: newPaper,
    clearPaper: clearPaper,
    stashed: stashed,
    openPaper: openPaper,
    summarize: summarize,
    recordResult: recordResult,
    markWrong: markWrong,
    removeWrong: removeWrong,
    toggleMark: toggleMark,
    toggleExclude: toggleExclude,
    counts: counts,
    tagCount: tagCount,
    isMarked: function (id) { return store.marked.indexOf(id) !== -1; },
    isExcluded: function (id) { return store.excluded.indexOf(id) !== -1; },
    lastResult: null
  };
})();

  var Q = window.QUIZ;

  var navEl = document.getElementById("nav");
  var viewEl = document.getElementById("view");

  var LETTERS = "ABCDEFGH";
  var ui = {
    view: "home",

    filterTags: [],
    filterType: "all",

  /* ---------------- 基础工具 ---------------- */

  function esc(s) {
    return String(s === undefined || s === null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function tagHtml(id, active) {
    var t = Q.tagOf(id);
    var g = Q.groupOf(t.group);
    return '<span class="tag' + (active ? " is-active" : "") + '" data-tone="' +
      esc(g.tone) + '" data-tag="' + esc(id) + '">' + esc(t.name) + "</span>";
  }

  function tagButtonHtml(id, active) {
    var t = Q.tagOf(id);
    var g = Q.groupOf(t.group);
    return '<button type="button" class="tag tag-button' + (active ? " is-active" : "") +
      '" data-tone="' + esc(g.tone) + '" data-action="toggle-filter-tag" data-tag="' + esc(id) + '">' +
      esc(t.name) + "</button>";
  }

  function typeBadge(type) {
    if (type === "multi") return '<span class="type-badge multi">多选题</span>';
    if (type === "fill") return '<span class="type-badge fill">填空题</span>';
    return '<span class="type-badge">单选题</span>';
  }

  function answerText(q) {
    if (q.type === "fill") {
      return (q.blanks || []).map(function (b) { return b.a[0]; }).join(" / ");
    }
    return q.answer.split("").join("、");
  }

  function stemHtml(q) {
    if (q.type !== "fill") return esc(q.stem);
    var parts = q.stem.split(/[_＿]{2,}/g);
    var html = "";
    for (var i = 0; i < parts.length; i++) {
      html += esc(parts[i]);
      if (i < parts.length - 1) {
        html += '<span class="blankslot">（' + (i + 1) + "）</span>";
      }
    }
    return html;
  }

  function toast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    window.clearTimeout(toast._t);
    toast._t = window.setTimeout(function () { toastEl.classList.remove("show"); }, 1900);
  }

  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }

  /* ---------------- 顶栏 ---------------- */

  var NAV = [
    { view: "home", label: "首页" },
    { act: "exam", label: "模拟试卷" },
    { act: "practice", label: "即时刷题" },
    { view: "tagselect", label: "分类练习" },
    { view: "bank", label: "查看题库" },
    { view: "marked", label: "收藏栏" },
    { view: "excluded", label: "屏蔽题目" },
    { view: "wrong", label: "历史错题" },
    { view: "changelog", label: "更新日志" },
    { act: "theme", label: "夜间模式" },
    { act: "submit", label: "交卷", primary: true }
  ];

  function renderNav() {
    var paper = Q.store.paper;
    var items = NAV.map(function (n) {
      if (n.act === "submit") {
        if (!paper || paper.submitted) return "";
        return '<button type="button" class="nav-btn primary" data-action="submit">交卷</button>';
      }
      if (n.act === "theme") {
        return '<button type="button" class="nav-btn" data-action="theme">夜间模式</button>';
      }
      if (n.act) {
        return '<button type="button" class="nav-btn" data-action="start-' + n.act + '">' + n.label + "</button>";
      }
      var cur = ui.view === n.view ? "true" : "false";
      return '<button type="button" class="nav-btn" aria-current="' + cur + '" data-view="' + n.view + '">' + n.label + "</button>";
    });
    navEl.innerHTML = items.join("");
  }

  /* ---------------- 首页 ---------------- */

  function renderHome() {
    var c = Q.counts();
    var wrongCount = Q.store.wrong.length;
    var markedCount = Q.store.marked.length;

    var hero = '' +
      '<section class="cover">' +
        '<div class="cover-main">' +
          '<div class="cover-eyebrow">第九十一期 · 复习指导与专题训练</div>' +
          '<h1 class="cover-title">入党申请人<br>结业考试<em>刷题</em></h1>' +
          '<p class="cover-sub">' + esc(META.source) +
            '。每道题按题型与事件线打标签，可整套模拟，也可按考点逐个击破。</p>' +
          '<div class="cover-stats">' +
            '<div class="stat"><span class="stat-num">' + c.total + '</span><span class="stat-label">题库总量</span></div>' +
            '<div class="stat"><span class="stat-num">' + c.single + '</span><span class="stat-label">单选题</span></div>' +
            '<div class="stat"><span class="stat-num">' + c.multi + '</span><span class="stat-label">多选题</span></div>' +
            '<div class="stat"><span class="stat-num">' + c.fill + '</span><span class="stat-label">填空题</span></div>' +
          '</div>' +
          '<div class="seal-wrap"><div class="seal">天津大学<br>学生党校<br>第九十一期</div></div>' +
        '</div>' +
        '<div class="cover-side">' +
          '<p class="side-note">题库速览 · 一格一题</p>' +
          '<div class="mini-card">' +
            '<div class="mini-card-head"><h3>题库构成</h3><span>' + c.total + ' 题</span></div>' +
            '<div class="mini-grid">' + miniGrid(c) + '</div>' +
            '<p class="side-note" style="margin-top:14px">实心 单选 ' + c.single +
              ' · 浅色 多选 ' + c.multi + ' · 空心 填空 ' + c.fill + '</p>' +
          '</div>' +
        '</div>' +
      '</section>';

    var modes = '' +
      '<div class="section-head"><h2 class="section-title">选择练习方式</h2>' +
        '<p class="section-note">所有练习记录、错题与收藏都保存在本机浏览器</p></div>' +
      '<div class="mode-grid">' +
        modeCard("exam", "模拟试卷", "随机抽 20 道单选、5 道多选、3 道填空，整套答完统一结算，按考试口径判分。",
          "20 单选 · 5 多选 · 3 填空", Q.stashed("exam") ? "上次进度可继续" : "可开始") +
        modeCard("practice", "即时刷题", "随机抽 30 道混合题，答完一题立刻给出判定与解析，适合逐题过一遍。",
          "30 题 · 即时判定", Q.stashed("practice") ? "上次进度可继续" : "可开始") +
        modeCard("tagselect", "分类练习", "把某个分类下的题全部刷一遍，顺序随机打乱；单选、多选、填空可单独练，也可只练某一段党史。",
          "按标签 · 全分类题目", "可开始") +
        modeCard("wrong", "错题重练", "从历史错题中去重抽题，答完即时反馈，把反复出错的知识点逐个清掉。",
          wrongCount + " 道错题", wrongCount ? "可开始" : "暂无错题", !wrongCount) +
      '</div>' +
      '<div class="chip-row" style="margin-top:14px">' +
        '<button type="button" class="btn btn-sm" data-view="bank">查看题库</button>' +
        '<button type="button" class="btn btn-sm" data-view="marked">收藏栏（' + markedCount + '）</button>' +
        '<button type="button" class="btn btn-sm" data-view="excluded">屏蔽题目（' + Q.store.excluded.length + '）</button>' +
        '<button type="button" class="btn btn-sm" data-view="wrong">历史错题</button>' +
        '<button type="button" class="btn btn-sm" data-view="changelog">更新日志</button>' +
      '</div>';

    var tagSection = '' +
      '<div class="section-head"><h2 class="section-title">按事件线浏览考点</h2>' +
        '<p class="section-note">标签体系分 6 大类、20 个考点</p></div>' +
      '<div class="tag-groups">' +
        Q.groups.map(function (g) {
          var tags = Q.tags.filter(function (t) { return t.group === g.id; });
          if (!tags.length) return "";
          return '<div class="tag-group-block">' +
            '<div class="tag-group-head"><span class="tag-group-name">' + esc(g.name) +
            '</span><span class="tag-group-note">' + esc(g.note) + "</span></div>" +
            '<div class="chip-row">' + tags.map(function (t) {
              return '<button type="button" class="tag tag-button" data-tone="' + esc(g.tone) +
                '" data-action="quick-tag" data-tag="' + esc(t.id) + '">' + esc(t.name) +
                '<span style="opacity:.6"> ' + Q.tagCount(t.id) + "</span></button>";
            }).join("") + "</div></div>";
        }).join("") +
      '</div>';

    var records = Q.store.records.length ? (
      '<div class="section-head"><h2 class="section-title">最近练习</h2>' +
        '<p class="section-note">共 ' + Q.store.records.length + ' 次</p></div>' +
      '<div class="kv-grid">' + Q.store.records.slice(0, 5).map(function (r) {
        var d = new Date(r.ts);
        var mm = String(d.getMonth() + 1);
        var dd = String(d.getDate());
        return '<div class="kv"><span class="kv-num">' + r.score + "</span>" +
          '<span class="kv-label">' + esc(r.label) + " · " + mm + "/" + dd + "</span></div>";
      }).join("") + "</div>"
    ) : "";

    return hero + modes + tagSection + records;
  }

  function miniGrid(c) {
    var n = c.total;
    var cells = [];
    for (var i = 0; i < n; i++) {
      var cls = "mini-cell";
      if (i < c.single) cls += " hit";
      else if (i < c.single + c.multi) cls += " smudge";
      cells.push('<div class="' + cls + '">' + (i + 1) + "</div>");
    }
    return cells.join("");
  }

  function modeCard(kind, name, desc, metaLeft, metaRight, off) {
    var action = kind === "tagselect" ? "" : ' data-action="start-' + kind + '"';
    var viewAttr = kind === "tagselect" ? ' data-view="tagselect"' : "";
    return '<button type="button" class="mode-card' + (off ? " off" : "") + '"' +
      (off ? " disabled" : action + viewAttr) + ">" +
      '<span class="mode-card-top"><span class="mode-name">' + esc(name) + "</span>" +
      '<span class="mode-mark">' + arrowIcon() + "</span></span>" +
      '<span class="mode-desc">' + esc(desc) + "</span>" +
      '<span class="mode-meta"><span>' + esc(metaLeft) + "</span><span>" + esc(metaRight) + "</span></span>" +
      "</button>";
  }

  function arrowIcon() {
    return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.6">' +
      '<path d="M5 12h14M13 6l6 6-6 6"></path></svg>';
  }

  /* ---------------- 分类练习（标签选择） ---------------- */

  function renderTagSelect() {
    var typeChips = [
      { id: "all", label: "全部题型" },
      { id: "single", label: "单选题" },
      { id: "multi", label: "多选题" },
      { id: "fill", label: "填空题" }
    ].map(function (t) {
      return '<button type="button" class="tag tag-button' + (ui.tagType === t.id ? " is-active" : "") +
        '" data-action="tag-type" data-type="' + t.id + '">' + t.label + "</button>";
    }).join("");

    var pool = QQUI_pool(ui.tagSel, ui.tagType);

    var groups = Q.groups.map(function (g) {
      var tags = Q.tags.filter(function (t) { return t.group === g.id; });
      return '<div class="tag-group-block">' +
        '<div class="tag-group-head"><span class="tag-group-name">' + esc(g.name) +
        '</span><span class="tag-group-note">' + esc(g.note) + "</span></div>" +
        '<div class="chip-row">' + tags.map(function (t) {
          var n = Q.tagCount(t.id);
          return '<button type="button" class="tag tag-button' +
            (ui.tagSel.indexOf(t.id) !== -1 ? " is-active" : "") +
            '" data-tone="' + esc(g.tone) + '" data-action="toggle-tag" data-tag="' + esc(t.id) + '">' +
            esc(t.name) + '<span style="opacity:.6"> ' + n + "</span></button>";
        }).join("") + "</div></div>";
    }).join("");

    return '' +
      '<div class="section-head"><h2 class="section-title">分类练习</h2>' +
        '<p class="section-note">先选题型，再选事件线；不选标签则练全库，顺序随机打乱、不抽题截断</p></div>' +
      '<div class="filter-bar">' +
        '<div class="filter-line"><span class="filter-label">题型</span>' + typeChips + "</div>" +
        '<div class="filter-line"><span class="filter-label">已选</span>' +
          (ui.tagSel.length
            ? ui.tagSel.map(function (id) { return tagHtml(id, true); }).join("")
            : '<span class="section-note">未选标签 · 全库全部题目</span>') +
          (ui.tagSel.length ? '<button type="button" class="btn btn-sm btn-ghost" data-action="clear-tags">清空</button>' : "") +
        "</div>" +
      "</div>" +
      '<div class="tag-groups">' + groups + "</div>" +
      '<div class="start-bar">' +
        '<div class="start-info">当前分类共 <strong>' + pool + "</strong> 题，将全部刷一遍（顺序随机打乱）</div>" +
        '<button type="button" class="btn btn-solid" data-action="start-tag"' + (pool ? "" : " disabled") +
          ">开始分类练习</button>" +
      "</div>";
  }

  function QQUI_pool(tags, type) {
    return Q.all.filter(function (q) {
      if (Q.isExcluded(q.id)) return false;
      if (type !== "all" && q.type !== type) return false;
      if (!tags.length) return true;
      return (q.tags || []).some(function (t) { return tags.indexOf(t) !== -1; });
    }).length;
  }

  /* ---------------- 答题视图 ---------------- */

  function renderQuiz() {
    var paper = Q.store.paper;
    if (!paper) { ui.view = "home"; return renderHome(); }
    var idx = Math.min(paper.index, paper.qids.length - 1);
    paper.index = idx;
    var qid = paper.qids[idx];
    var q = Q.byId(qid);
    var ans = paper.answers[qid];
    var revealed = paper.submitted || paper.review || !!paper.checked[qid];
    var res = Q.grade(q, ans, paper.amend[qid]);

    var head = '<div class="sheet-head">' +
      '<span class="sheet-index">第 ' + pad(idx + 1) + " / " + paper.qids.length + " 题</span>" +
      typeBadge(q.type) +
      (q.src ? '<span>' + esc(q.src) + "</span>" : "") +
      '<span class="spacer"></span>' +
      Q.tagSelectors(q).map(function (t) { return tagHtml(t.id); }).join("") +
      (Q.isMarked(qid) ? '<span class="tag is-active" data-tone="amber">已收藏</span>' : "") +
      "</div>";

    var body = '<h2 class="stem">' + stemHtml(q) + "</h2>";

    if (q.type === "fill") {
      body += '<div class="fill-grid">' + (q.blanks || []).map(function (b, i) {
        var v = Array.isArray(ans) ? ans[i] || "" : "";
        var ok = revealed ? Q.checkBlank(v, b) : null;
        var cls = "fill-input";
        var flag = "";
        if (revealed) {
          if (v && ok) { cls += " ok"; flag = "对"; }
          else if (v) {
            /* 本题部分正确时，答错的空用琥珀色，与整题答错的红区分 */
            cls += res.status === "partial" ? " half" : " no";
            flag = "错";
          } else { cls += res.status === "partial" ? " gap" : " no"; flag = "未填"; }
        }
        return '<div class="fill-row"><span class="fill-no">(' + (i + 1) + ')</span>' +
          '<input class="' + cls + '" type="text" data-action="fill-input" data-qid="' + esc(qid) +
          '" data-idx="' + i + '" value="' + esc(v) + '" placeholder="填写第 ' + (i + 1) +
          ' 空的答案"' + (revealed ? " readonly" : "") + ">" +
          '<span class="fill-flag">' + flag + "</span></div>";
      }).join("") + "</div>";
      if (!revealed) {
        body += '<p class="section-note">按原文用字作答；标点与空格不影响判定，重点长句按关键词判定。</p>';
      }
    } else {
      body += '<div class="options">' + q.options.map(function (opt, i) {
        var letter = LETTERS.charAt(i);
        var selected = q.type === "multi"
          ? (Array.isArray(ans) && ans.indexOf(letter) !== -1)
          : ans === letter;
        var isRight = q.answer.indexOf(letter) !== -1;
        var cls = "option";
        var optTag = "";
        if (selected) cls += " selected";
        if (revealed) {
          cls += " locked";
          if (isRight) {
            if (selected) cls += " correct";
            else if (q.type === "multi") {
              cls += " missed";
              optTag = '<span class="option-tag part">漏选</span>';
            } else cls += " correct";
          } else if (selected) cls += " wrong";
        }
        return '<button type="button" class="' + cls + '" data-action="option" data-qid="' + esc(qid) +
          '" data-letter="' + letter + '"' + (revealed ? " data-locked=\"1\"" : "") + ">" +
          '<span class="option-marker">' + letter + "</span>" +
          '<span class="option-text">' + esc(opt) + "</span>" + optTag + "</button>";
      }).join("") + "</div>";
      if (q.type === "multi" && !revealed) {
        body += '<div class="chip-row" style="margin:14px 0 4px">' +
          '<button type="button" class="btn btn-sm btn-solid" data-action="reveal">确认答案</button>' +
          '<span class="section-note">多选：全对 2 分，漏选 1 分，多选或错选 0 分</span></div>';
      }
    }

    var feedback = "";
    if (revealed) {
      var verdict = "";
      if (res.status === "correct") verdict = '<span class="verdict ok">答对 · +' + res.score + " 分</span>";
      else if (res.status === "partial") verdict = '<span class="verdict part">部分正确 · +' + res.score + " 分</span>";
      else if (res.status === "wrong" && res.blank) verdict = '<span class="verdict no">未作答 · 按答错计 0 分</span>';
      else verdict = '<span class="verdict no">答错 · 0 分</span>';

      feedback = '<div class="feedback"><div class="feedback-head">' + verdict +
        '<span class="answer-line">答案：<strong>' + esc(answerText(q)) + "</strong></span>" +
        "</div>" +
        (q.ex ? '<p class="explain">' + esc(q.ex) + "</p>" : "") +
        (q.type === "fill" && res.status !== "correct" && Q.isAnswered(q, ans) && !paper.amend[qid]
          ? '<div class="chip-row"><button type="button" class="btn btn-sm" data-action="amend">我答对了，按正确计分</button></div>'
          : "") +
        "</div>";
    }

    var foot = '<div class="sheet-foot">' +
      '<button type="button" class="btn" data-action="prev"' + (idx === 0 ? " disabled" : "") + ">上一题</button>" +
      '<button type="button" class="btn" data-action="next"' +
        (idx === paper.qids.length - 1 ? " disabled" : "") + ">下一题</button>" +
      '<span class="spacer"></span>' +
      (revealed ? "" : '<button type="button" class="btn btn-sm" data-action="reveal">显示答案</button>') +
      '<button type="button" class="btn btn-sm" data-action="mark">' +
        (Q.isMarked(qid) ? "取消收藏" : "收藏本题") + "</button>" +
      '<button type="button" class="btn btn-sm" data-action="exclude">' +
        (Q.isExcluded(qid) ? "取消屏蔽" : "屏蔽本题") + "</button>" +
      '<button type="button" class="btn btn-sm" data-action="new-paper">重新组卷</button>' +
      "</div>";

    var sheet = '<article class="sheet">' + head + body + feedback + foot + "</article>";

    return '<div class="quiz-layout">' + sheet + answerCard(paper, revealed) + "</div>";
  }

  function pad(n) { return n < 10 ? "0" + n : String(n); }

  function answerCard(paper, revealed) {
    var answered = paper.qids.filter(function (id, i) {
      return Q.isAnswered(Q.byId(id), paper.answers[id]);
    }).length;

    var cells = paper.qids.map(function (id, i) {
      var q = Q.byId(id);
      var st = "unanswered";
      var cls = "card-cell";
      /* 只按「这一题自己」是否看过答案上色，不能借用当前页的判定状态，
         否则停在某道已判定的题上时，其余未作答的题会被一起判成答错 */
      var rev = !!paper.submitted || !!paper.review || !!paper.checked[id];
      if (rev) {
        var r = Q.grade(q, paper.answers[id], paper.amend[id]);
        if (r.status === "correct") st = "correct";
        else if (r.status === "partial") st = "partial";
        else st = "wrong";
      } else if (Q.isAnswered(q, paper.answers[id])) {
        st = "answered";
      }
      if (st !== "unanswered") cls += " " + st;
      if (i === paper.index) cls += " current";
      return '<button type="button" class="' + cls + '" data-action="jump" data-idx="' + i +
        '" aria-label="第 ' + (i + 1) + ' 题">' + (i + 1) + "</button>";
    }).join("");

    var legend = '<div class="legend">' +
      '<span><i class="cur"></i>当前</span>' +
      '<span><i class="ans"></i>已答</span>' +
      '<span><i class="ok"></i>正确</span>' +
      '<span><i class="part"></i>部分</span>' +
      '<span><i class="no"></i>错误</span>' +
      '<span><i class="blank"></i>未答</span></div>';

    var actions = paper.submitted
      ? '<div class="card-actions">' +
          '<button type="button" class="btn btn-solid" data-view="result">查看本次结算</button>' +
          '<button type="button" class="btn" data-action="new-same">重新组卷</button>' +
          '<button type="button" class="btn" data-action="to-home">回到首页</button>' +
        "</div>"
      : '<div class="card-actions">' +
          '<button type="button" class="btn btn-solid" data-action="submit">交卷结算</button>' +
          '<button type="button" class="btn" data-action="new-same">重新组卷</button>' +
        "</div>";

    return '<aside class="card-sheet">' +
      '<div class="card-sheet-head"><h2>答题卡</h2><span class="count">' + answered + " / " + paper.qids.length + "</span></div>" +
      '<div class="card-grid">' + cells + "</div>" +
      '<div class="card-progress"><i style="width:' + pct(answered, paper.qids.length) + '%"></i></div>' +
      legend + actions +
      "</aside>";
  }

  /* ---------------- 结算 ---------------- */

  function renderResult() {
    var paper = Q.store.paper;
    if (!paper || !paper.submitted) { ui.view = "home"; return renderHome(); }
    var s = Q.summarize(paper);
    var rate = pct(s.score, s.max);
    var pass = rate >= 60;

    var tagRows = Object.keys(s.tagAgg).map(function (id) {
      var a = s.tagAgg[id];
      return { id: id, name: Q.tagOf(id).name, tone: Q.groupOf(Q.tagOf(id).group).tone, right: a.right, all: a.all, rate: pct(a.right, a.all) };
    }).sort(function (x, y) { return x.rate - y.rate; });

    var breakdown = '<div class="section-head"><h2 class="section-title">考点得分分布</h2>' +
      '<p class="section-note">按标签统计，从最薄弱的开始</p></div><div class="breakdown">' +
      tagRows.map(function (r) {
        return '<div class="bar-row"><span class="bar-name" data-tone="' + esc(r.tone) + '">' + esc(r.name) +
          '</span><div class="bar-track"><i class="bar-fill' + (r.rate < 60 ? " hot" : "") +
          '" style="width:' + r.rate + '%"></i></div><span class="bar-val">' +
          r.right + "/" + r.all + "</span></div>";
      }).join("") + "</div>";

    var wrongItems = paper.qids.filter(function (id) {
      var r = Q.grade(Q.byId(id), paper.answers[id], paper.amend[id]);
      return r.status !== "correct";
    });

    var reviewList = wrongItems.length ? (
      '<div class="section-head"><h2 class="section-title">需要回看的题</h2>' +
        '<p class="section-note">共 ' + wrongItems.length + " 道</p></div>" +
      '<div class="review-list">' + wrongItems.map(function (id) {
        var q = Q.byId(id);
        var r = Q.grade(q, paper.answers[id], paper.amend[id]);
        var your = q.type === "fill"
          ? (Array.isArray(paper.answers[id]) ? paper.answers[id].join(" / ") : "")
          : (Array.isArray(paper.answers[id]) ? paper.answers[id].join("、") : (paper.answers[id] || "未作答"));
        var stTag = r.status === "partial" ? '<span class="st-tag part">部分正确</span>' :
          (r.blank ? '<span class="st-tag no">未作答 · 答错</span>' :
            '<span class="st-tag no">答错</span>');
        return '<div class="review-item"><p class="review-stem">' + stemHtml(q) + "</p>" +
          '<div class="review-meta">' + typeBadge(q.type) + stTag +
          "<span>你的答案：<b>" + esc(your || "未作答") + "</b></span>" +
          "<span>正确答案：" + esc(answerText(q)) + "</span>" +
          "<span>" + esc(q.src || "") + "</span></div>" +
          (q.ex ? '<p class="explain" style="margin-top:8px">' + esc(q.ex) + "</p>" : "") +
          "</div>";
      }).join("") + "</div>"
    ) : '<div class="empty-state"><strong>全部答对</strong>这套卷子没有需要回看的题。</div>';

    return '<section class="result-panel">' +
      '<div class="result-top">' +
        '<div class="score-block"><span class="score-num">' + s.score + '</span><span class="score-den">/ ' + s.max + " 分</span></div>" +
        '<div class="score-side"><h2 class="result-title">' + esc(paper.label) + " · 结算</h2>" +
          '<p class="result-sub">正确率 ' + rate + "% · " + (pass ? "达到及格线口径（60%）" : "低于及格线口径（60%）") +
          " · 共 " + s.count + " 题</p>" +
          '<div class="chip-row" style="margin-top:6px">' +
            '<button type="button" class="btn btn-sm btn-solid" data-action="review-all">整卷回顾</button>' +
            '<button type="button" class="btn btn-sm" data-action="new-same">重新组卷</button>' +
            '<button type="button" class="btn btn-sm" data-view="wrong">历史错题</button>' +
            '<button type="button" class="btn btn-sm" data-action="to-home">回到首页</button>' +
          "</div></div>" +
      "</div>" +
      '<div class="kv-grid">' +
        kv(s.correct, "答对", "ok") + kv(s.partial, "部分正确", "part") +
        kv(s.wrong, "答错", "no") + kv(paper.qids.length, "题量") +
      "</div>" +
      breakdown +
      reviewList +
      "</section>";
  }

  function kv(n, label, tone) {
    return '<div class="kv"><span class="kv-num' + (tone ? " " + tone : "") + '">' + n +
      '</span><span class="kv-label">' + label + "</span></div>";
  }

  /* ---------------- 题库 / 列表 ---------------- */

  function filteredBank() {
    var kw = ui.search.trim();
    return Q.all.filter(function (q) {
      if (ui.filterType !== "all" && q.type !== ui.filterType) return false;
      if (ui.filterTags.length) {
        var hit = (q.tags || []).some(function (t) { return ui.filterTags.indexOf(t) !== -1; });
        if (!hit) return false;
      }
      if (ui.filterState === "marked" && !Q.isMarked(q.id)) return false;
      if (ui.filterState === "wrong" && !Q.store.wrong.some(function (w) { return w.id === q.id; })) return false;
      if (kw) {
        var hay = q.stem + " " + (q.options || []).join(" ") + " " + (q.src || "") + " " +
          (q.tags || []).map(function (t) { return Q.tagOf(t).name; }).join(" ");
        if (hay.indexOf(kw) === -1) return false;
      }
      return true;
    });
  }

  function renderBank() {
    var list = filteredBank();
    var typeChips = [
      { id: "all", label: "全部" }, { id: "single", label: "单选" },
      { id: "multi", label: "多选" }, { id: "fill", label: "填空" }
    ].map(function (t) {
      return '<button type="button" class="tag tag-button' + (ui.filterType === t.id ? " is-active" : "") +
        '" data-action="filter-type" data-type="' + t.id + '">' + t.label + "</button>";
    }).join("");

    var stateChips = [
      { id: "all", label: "全部" }, { id: "marked", label: "已收藏" }, { id: "wrong", label: "错题本内" }
    ].map(function (t) {
      return '<button type="button" class="tag tag-button' + (ui.filterState === t.id ? " is-active" : "") +
        '" data-action="filter-state" data-state="' + t.id + '">' + t.label + "</button>";
    }).join("");

    var tagChips = Q.groups.map(function (g) {
      var tags = Q.tags.filter(function (t) { return t.group === g.id; });
      return tags.map(function (t) {
        return tagButtonHtml(t.id, ui.filterTags.indexOf(t.id) !== -1);
      }).join("");
    }).join("");

    var bar = '<div class="filter-bar">' +
      '<div class="filter-line">' +
        '<span class="search-box">' + searchIcon() +
        '<input type="search" id="bankSearch" placeholder="搜索题干、选项、来源或标签" value="' + esc(ui.search) + '">' +
        "</span>" +
      "</div>" +
      '<div class="filter-line"><span class="filter-label">题型</span>' + typeChips +
        '<span class="filter-label" style="margin-left:12px">状态</span>' + stateChips + "</div>" +
      '<div class="filter-line"><span class="filter-label">标签</span><div class="chip-row">' + tagChips + "</div></div>" +
      "</div>";

    var headLine = '<div class="list-count"><span>共 ' + list.length + " 道（题库总计 " + Q.all.length + " 道）</span>" +
      (ui.filterTags.length || ui.filterType !== "all" || ui.filterState !== "all" || ui.search
        ? '<button type="button" class="btn btn-sm btn-ghost" data-action="clear-filter">清空筛选</button>' : "") +
      "</div>";

    var body = list.length
      ? '<div class="q-list">' + list.map(function (q) { return qItem(q, "bank"); }).join("") + "</div>"
      : '<div class="empty-state"><strong>没有匹配的题目</strong>换个关键词，或清空筛选条件再试。</div>';

    return '<div class="section-head"><h2 class="section-title">查看题库</h2>' +
      '<p class="section-note">题干、答案与解析全部可见</p></div>' + bar + headLine + body;
  }

  function searchIcon() {
    return '<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">' +
      '<circle cx="11" cy="11" r="6"></circle><path d="M16 16l4 4"></path></svg>';
  }

  function qItem(q, ctx) {
    var opts = q.type === "fill" ? "" :
      '<div class="q-item-opts">' + q.options.map(function (o, i) {
        var letter = LETTERS.charAt(i);
        var right = q.answer.indexOf(letter) !== -1;
        return "<span>" + letter + ". " + esc(o) + (right ? '　<span class="ans-key">对</span>' : "") + "</span>";
      }).join("") + "</div>";

    var wrongInfo = Q.store.wrong.filter(function (w) { return w.id === q.id; })[0];

    return '<div class="q-item">' +
      '<div class="q-item-head"><span class="q-item-id">' + esc(q.id.toUpperCase()) + "</span>" +
        typeBadge(q.type) +
        Q.tagSelectors(q).map(function (t) { return tagHtml(t.id); }).join("") +
        (q.src ? "<span>" + esc(q.src) + "</span>" : "") +
        (wrongInfo ? '<span class="tag" data-tone="crimson">错 ' + wrongInfo.n + " 次</span>" : "") +
      "</div>" +
      '<p class="q-item-stem">' + stemHtml(q) + "</p>" + opts +
      '<div class="q-item-foot">' +
        '<span class="ans-key' + (q.type === "fill" ? " fill" : "") + '">答案：' + esc(answerText(q)) + "</span>" +
        '<span class="spacer" style="flex:1"></span>' +
        '<button type="button" class="btn btn-sm" data-action="mark" data-qid="' + esc(q.id) + '">' +
          (Q.isMarked(q.id) ? "取消收藏" : "收藏") + "</button>" +
        '<button type="button" class="btn btn-sm" data-action="exclude" data-qid="' + esc(q.id) + '">' +
          (Q.isExcluded(q.id) ? "取消屏蔽" : "屏蔽") + "</button>" +
      "</div>" +
      (q.ex ? '<p class="explain" style="margin-top:8px">' + esc(q.ex) + "</p>" : "") +
      "</div>";
  }

  function renderMarked() {
    var list = Q.store.marked.map(function (id) { return Q.byId(id); }).filter(Boolean);
    return '<div class="section-head"><h2 class="section-title">收藏栏</h2>' +
      '<p class="section-note">' + list.length + " 道题被标记为重点</p></div>" +
      (list.length
        ? '<div class="q-list">' + list.map(function (q) { return qItem(q, "marked"); }).join("") + "</div>"
        : '<div class="empty-state"><strong>还没有收藏题目</strong>在答题页或题库里点「收藏」，题目就会出现在这里。</div>');
  }

  function renderExcluded() {
    var list = Q.store.excluded.map(function (id) { return Q.byId(id); }).filter(Boolean);
    return '<div class="section-head"><h2 class="section-title">屏蔽题目</h2>' +
      '<p class="section-note">已屏蔽的题不再出现在任何随机抽题中</p></div>' +
      (list.length
        ? '<div class="q-list">' + list.map(function (q) { return qItem(q, "excluded"); }).join("") + "</div>"
        : '<div class="empty-state"><strong>没有屏蔽任何题目</strong>掌握熟练、不想再抽到的题，可以在题库里屏蔽。</div>');
  }

  function renderWrong() {
    var list = Q.store.wrong.map(function (w) {
      return { q: Q.byId(w.id), n: w.n || 1, ts: w.ts };
    }).filter(function (x) { return x.q; });

    var head = '<div class="section-head"><h2 class="section-title">历史错题</h2>' +
      '<p class="section-note">共 ' + list.length + " 道，可一键重练</p></div>";

    if (!list.length) {
      return head + '<div class="empty-state"><strong>错题本是空的</strong>答错的题会自动进来，练完一次模拟卷就有了。</div>';
    }

    var tools = '<div class="chip-row" style="margin-bottom:14px">' +
      '<button type="button" class="btn btn-sm btn-solid" data-action="start-wrong">重练全部错题</button>' +
      '<button type="button" class="btn btn-sm" data-action="clear-wrong">清空错题本</button>' +
      "</div>";

    return head + tools + '<div class="q-list">' + list.map(function (x) {
      var d = new Date(x.ts || Date.now());
      var item = qItem(x.q, "wrong");
      return item.replace('<div class="q-item-head">',
        '<div class="q-item-head"><span class="wrong-meta">错 ' + x.n + " 次 · " +
        (d.getMonth() + 1) + "/" + d.getDate() + " 记录</span>");
    }).join("") + "</div>";
  }

  function renderChangelog() {
    return '<div class="section-head"><h2 class="section-title">更新日志</h2>' +
      '<p class="section-note">当前版本 ' + esc(META.version) + " · 构建于 " + esc(META.buildDate) + "</p></div>" +
      '<div class="log-list">' + CHANGELOG.map(function (log) {
        return '<div class="log-entry"><div class="log-date">' + esc(log.date) + "</div>" +
          '<div><h3 class="log-title">' + esc(log.title) + " <span class=\"section-note\">" + esc(log.version) + "</span></h3>" +
          '<ul class="log-items">' + log.items.map(function (i) { return "<li>" + esc(i) + "</li>"; }).join("") +
          "</ul></div></div>";
      }).join("") + "</div>" +
      '<div class="footnote"><span>' + esc(META.subtitle) + "</span><span>资料用于复习，考试以当期文件为准</span></div>";
  }

  /* ---------------- 主渲染 ---------------- */

  var TITLES = {
    home: "入党申请人结业考试刷题",
    tagselect: "分类练习",
    quiz: "答题",
    result: "结算",
    bank: "查看题库",
    marked: "收藏栏",
    excluded: "屏蔽题目",
    wrong: "历史错题",
    changelog: "更新日志"
  };

  function render(keepScroll) {
    var paper = Q.store.paper;
    if (ui.view === "quiz" && !paper) ui.view = "home";
    if (ui.view === "result" && (!paper || !paper.submitted)) ui.view = "home";

    var html = "";
    switch (ui.view) {
      case "tagselect": html = renderTagSelect(); break;
      case "quiz": html = renderQuiz(); break;
      case "result": html = renderResult(); break;
      case "bank": html = renderBank(); break;
      case "marked": html = renderMarked(); break;
      case "excluded": html = renderExcluded(); break;
      case "wrong": html = renderWrong(); break;
      case "changelog": html = renderChangelog(); break;
      default: ui.view = "home"; html = renderHome();
    }
    var y = keepScroll ? window.scrollY : 0;
    viewEl.innerHTML = html;
    titleEl.textContent = TITLES[ui.view] || TITLES.home;
    renderNav();
    if (keepScroll) window.scrollTo(0, y);
    applyTheme();
  }

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", Q.store.theme === "dark" ? "dark" : "light");
  }

  /* ---------------- 动作 ---------------- */

  /* 打开某个练习模式：已有进度就接着上次，只有「重新组卷」才真的换一份 */
  function enterPaper(mode) {
    var live = Q.stashed(mode);
    if (live) {
      Q.openPaper(mode);
      ui.view = "quiz";
      render();
      toast("已回到上次的「" + live.label + "」，第 " + (live.index + 1) + " / " + live.qids.length + " 题");
      return;
    }
    var done = (Q.store.papers || {})[mode];
    if (done && done.submitted) {
      Q.openPaper(mode);
      ui.view = "result";
      render();
      toast("上次这份已交卷，可查看结算，或点「重新组卷」再来一份");
      return;
    }
    startPaper(mode);
  }

  function startPaper(mode) {
    var paper = Q.newPaper(mode);
    if (!paper) { toast("没有可用的题目，请先取消部分屏蔽"); return; }
    if (mode === "wrong" && !paper.qids.length) { toast("错题本里还没有题"); return; }
    ui.view = "quiz";
    render();
    toast("已生成「" + paper.label + "」共 " + paper.qids.length + " 题");
  }

  function submitPaper() {
    var paper = Q.store.paper;
    if (!paper) return;
    if (!paper.qids.some(function (id) { return Q.isAnswered(Q.byId(id), paper.answers[id]); })) {
      toast("还没有作答，先答几题再交卷");
      return;
    }
    paper.submitted = true;
    paper.review = false;
    /* 答错的题写入错题本 */
    paper.qids.forEach(function (id) {
      var q = Q.byId(id);
      var r = Q.grade(q, paper.answers[id], paper.amend[id]);
      if (r.status === "wrong" || r.status === "partial") Q.markWrong(id);
    });
    Q.recordResult(paper);
    Q.save();
    ui.view = "result";
    render();
    toast("已交卷，查看结算");
  }

  function revealCurrent() {
    var paper = Q.store.paper;
    if (!paper) return;
    var qid = paper.qids[paper.index];
    paper.checked[qid] = true;
    var r = Q.grade(Q.byId(qid), paper.answers[qid], paper.amend[qid]);
    if (r.status === "wrong" || r.status === "partial") {
      Q.markWrong(qid);
      Q.save();
    }
    render(true);
  }

  function go(delta) {
    var paper = Q.store.paper;
    if (!paper) return;
    var next = paper.index + delta;
    if (next < 0 || next >= paper.qids.length) return;
    paper.index = next;
    Q.save();
    render(true);
  }

  function jumpTo(i) {
    var paper = Q.store.paper;
    if (!paper) return;
    paper.index = i;
    Q.save();
    render(true);
  }

  /* ---------------- 事件绑定 ---------------- */

  document.addEventListener("click", function (ev) {
    var el = ev.target.closest ? ev.target.closest("[data-action],[data-view]") : null;
    if (!el) return;
    var action = el.getAttribute("data-action");
    var view = el.getAttribute("data-view");
    var paper = Q.store.paper;

    if (view) {
      ui.view = view;
      render();
      return;
    }

    switch (action) {
      case "start-exam": enterPaper("exam"); break;
      case "start-practice": enterPaper("practice"); break;
      case "start-wrong": enterPaper("wrong"); break;
      case "start-tag":
        var p = Q.newPaper("tag", { tags: ui.tagSel, type: ui.tagType });
        if (!p) { toast("该条件下没有题目"); return; }
        ui.view = "quiz";
        render();
        toast("已生成分类练习 " + p.qids.length + " 题");
        break;
      case "submit": submitPaper(); break;
      case "new-paper":
        if (paper) startPaper(paper.mode === "tag" ? "tag" : paper.mode);
        break;
      case "new-same":
        if (paper) {
          if (paper.mode === "tag") {
            Q.newPaper("tag", { tags: paper.filter.tags, type: paper.filter.type });
            ui.view = "quiz"; render();
          } else {
            startPaper(paper.mode);
          }
        }
        break;
      case "to-home": ui.view = "home"; render(); break;
      case "review-all":
        if (paper) { paper.review = true; ui.view = "quiz"; render(); }
        break;
      case "prev": go(-1); break;
      case "next": go(1); break;
      case "jump": jumpTo(parseInt(el.getAttribute("data-idx"), 10)); break;
      case "reveal": revealCurrent(); break;
      case "option": {
        if (!paper) return;
        if (el.getAttribute("data-locked")) return;
        var qid = el.getAttribute("data-qid");
        var q = Q.byId(qid);
        var letter = el.getAttribute("data-letter");
        if (q.type === "multi") {
          var arr = Array.isArray(paper.answers[qid]) ? paper.answers[qid].slice() : [];
          var at = arr.indexOf(letter);
          if (at === -1) arr.push(letter); else arr.splice(at, 1);
          paper.answers[qid] = arr;
        } else {
          paper.answers[qid] = letter;
        }
        Q.save();
        /* 即时刷题：单选点选后立刻判定 */
        if (paper.mode === "practice" || paper.mode === "tag") {
          if (q.type === "single") {
            paper.checked[qid] = true;
            var r = Q.grade(q, paper.answers[qid], paper.amend[qid]);
            if (r.status === "wrong" || r.status === "partial") { Q.markWrong(qid); Q.save(); }
          }
        }
        render(true);
        break;
      }
      case "fill": break;
      case "amend":
        if (!paper) return;
        paper.amend[paper.qids[paper.index]] = true;
        Q.save();
        render(true);
        break;
      case "mark": {
        var idM = el.getAttribute("data-qid") || (paper ? paper.qids[paper.index] : null);
        if (!idM) return;
        var added = Q.toggleMark(idM);
        toast(added ? "已加入收藏" : "已取消收藏");
        render(true);
        break;
      }
      case "exclude": {
        var idE = el.getAttribute("data-qid") || (paper ? paper.qids[paper.index] : null);
        if (!idE) return;
        var ex = Q.toggleExclude(idE);
        toast(ex ? "已屏蔽，不再出现在抽题中" : "已取消屏蔽");
        render(true);
        break;
      }
      case "theme":
        Q.store.theme = Q.store.theme === "dark" ? "light" : "dark";
        Q.save();
        render(true);
        break;
      case "toggle-filter-tag": {
        var tag = el.getAttribute("data-tag");
        var i = ui.filterTags.indexOf(tag);
        if (i === -1) ui.filterTags.push(tag); else ui.filterTags.splice(i, 1);
        render(true);
        break;
      }
      case "toggle-tag": {
        var tg = el.getAttribute("data-tag");
        var j = ui.tagSel.indexOf(tg);
        if (j === -1) ui.tagSel.push(tg); else ui.tagSel.splice(j, 1);
        render(true);
        break;
      }
      case "quick-tag":
        ui.tagSel = [el.getAttribute("data-tag")];
        ui.view = "tagselect";
        render();
        break;
      case "clear-tags": ui.tagSel = []; render(true); break;
      case "tag-type": ui.tagType = el.getAttribute("data-type"); render(true); break;
      case "filter-type": ui.filterType = el.getAttribute("data-type"); render(true); break;
      case "filter-state": ui.filterState = el.getAttribute("data-state"); render(true); break;
      case "clear-filter":
        ui.filterTags = []; ui.filterType = "all"; ui.filterState = "all"; ui.search = "";
        render(true);
        break;
      case "clear-wrong":
        Q.store.wrong = [];
        Q.save();
        toast("错题本已清空");
        render(true);
        break;
      default: break;
    }
  });

  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (!el) return;
    if (el.id === "bankSearch") {
      ui.search = el.value;
      var scrollY = window.scrollY;
      viewEl.innerHTML = renderBank();
      window.scrollTo(0, scrollY);
      var input = document.getElementById("bankSearch");
      if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      return;
    }
    if (el.getAttribute && el.getAttribute("data-action") === "fill-input") {
      var paper = Q.store.paper;
      if (!paper) return;
      var qid = el.getAttribute("data-qid");
      var idx = parseInt(el.getAttribute("data-idx"), 10);
      if (!Array.isArray(paper.answers[qid])) paper.answers[qid] = [];
      paper.answers[qid][idx] = el.value;
      Q.save();
      var cell = viewEl.querySelector('.card-cell[data-idx="' + paper.index + '"]');
      if (cell && paper.index === paper.qids.indexOf(qid)) {
        if (Q.isAnswered(Q.byId(qid), paper.answers[qid])) cell.classList.add("answered");
      }
    }
  });

  document.addEventListener("keydown", function (ev) {
    if (ui.view !== "quiz") return;
    var tag = (ev.target && ev.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if (ev.key === "ArrowLeft") { ev.preventDefault(); go(-1); }
    if (ev.key === "ArrowRight") { ev.preventDefault(); go(1); }
  });

  /* ---------------- 启动 ---------------- */

  applyTheme();
  render();
})();

</script>
</body>
</html>
